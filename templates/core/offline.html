{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're offline — Notipa</title>
<link rel="manifest" href="{% static 'core/manifest.json' %}">
<meta name="theme-color" content="#0B6E4F">
<style>
  :root { --brand: #0B6E4F; --brand-dim: #084F39; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f7f8f7;
    color: #1a2420;
    padding: 24px;
  }
  .offline-card {
    max-width: 380px;
    text-align: center;
    background: #fff;
    border: 1px solid #e3e7e4;
    border-radius: 16px;
    padding: 40px 32px;
  }
  .offline-card__mark {
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    border-radius: 14px;
    background: var(--brand);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .offline-card__mark svg { width: 28px; height: 28px; stroke: #fff; }
  h1 { font-size: 1.25rem; margin: 0 0 8px; }
  p { margin: 0 0 24px; color: #5b665f; line-height: 1.5; }
  button {
    font: inherit;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    background: var(--brand);
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: var(--brand-dim); }
</style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-card__mark">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11l18-7-7 18-2-8-9-3z"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Notipa needs a connection to load your school's announcements, homework and notices. Reconnect and try again.</p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
