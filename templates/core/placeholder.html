{% extends "base.html" %}

{% block title %}{{ title }} — Notipa{% endblock %}

{% block breadcrumb %}
  <span class="topbar__breadcrumb-current">{{ title }}</span>
{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <span class="page-header__eyebrow">Coming soon</span>
    <h1>{{ title }}</h1>
  </div>
</div>

<div class="card">
  <div class="empty-state">
    <div class="empty-state__icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
    </div>
    <div class="empty-state__title">Not built yet</div>
    <div class="empty-state__message">{{ message }}</div>
  </div>
</div>
{% endblock %}
